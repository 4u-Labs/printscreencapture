<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>PrintScreen Editor</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body class="dark-theme">
    <div class="popup-container">
        <!-- Header -->
        <header class="popup-header">
            <div class="logo-area">
                <img src="../assets/icon128.png" alt="Logo" class="logo-img">
                <span class="logo-title">PrintScreen <span class="logo-version">v2.0</span></span>
            </div>
            <button class="icon-btn settings-btn" id="openSettingsBtn" title="Configurações e Dashboard">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
        </header>

        <!-- Command Menu (Raycast/CleanShot Style) -->
        <main class="menu-list">
            <button class="menu-item" id="btnCaptureArea">
                <div class="menu-item-left">
                    <div class="icon-wrap icon-area">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line></svg>
                    </div>
                    <div class="menu-item-text">
                        <span class="menu-title">Área Selecionada</span>
                        <span class="menu-desc">Arraste para selecionar a área</span>
                    </div>
                </div>
                <kbd class="shortcut">⌥A</kbd>
            </button>

            <button class="menu-item" id="btnCaptureVisible">
                <div class="menu-item-left">
                    <div class="icon-wrap icon-visible">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </div>
                    <div class="menu-item-text">
                        <span class="menu-title">Área Visível</span>
                        <span class="menu-desc">Captura a tela visível atual</span>
                    </div>
                </div>
                <kbd class="shortcut">⌥S</kbd>
            </button>

            <button class="menu-item" id="btnCaptureFull">
                <div class="menu-item-left">
                    <div class="icon-wrap icon-full">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M12 8v8m-4-4h8"></path></svg>
                    </div>
                    <div class="menu-item-text">
                        <span class="menu-title">Página Inteira</span>
                        <span class="menu-desc">Rolagem automática de página</span>
                    </div>
                </div>
                <span class="status-badge">AUTO</span>
            </button>

            <button class="menu-item" id="btnHistory">
                <div class="menu-item-left">
                    <div class="icon-wrap icon-history">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    </div>
                    <div class="menu-item-text">
                        <span class="menu-title">Histórico de Prints</span>
                        <span class="menu-desc">Gerencie e analise suas capturas</span>
                    </div>
                </div>
            </button>
        </main>

        <!-- Footer / Quick Settings -->
        <footer class="popup-footer">
            <span class="footer-tip">Dica: Use atalhos globais configuráveis.</span>
            <div class="ai-status-indicator" id="aiStatus" title="Status do IA Engine">
                <span class="ai-dot active"></span>
                <span class="ai-text">IA Ativa</span>
            </div>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
