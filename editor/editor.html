<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estúdio PrintScreen — Editor & IA Engine</title>
    <link rel="stylesheet" href="editor.css">
    <!-- QR Code Generator Lib (Optional - We can use a lightweight public API like qrserver or build locally) -->
</head>
<body class="dark-theme">
    <div class="editor-layout">
        <!-- Top Toolbar -->
        <header class="editor-header">
            <div class="header-left">
                <a href="../dashboard/dashboard.html" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    <span>Dashboard</span>
                </a>
                <div class="v-divider"></div>
                <span class="editing-title" id="editingTitle">Captura Recente</span>
            </div>

            <!-- Canvas Drawing Tools (Notion/Linear Inspired) -->
            <div class="header-center drawing-toolbar">
                <button class="tool-btn active" id="toolSelect" title="Mover / Selecionar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path><path d="M13 13l6 6"></path></svg>
                </button>
                <button class="tool-btn" id="toolCrop" title="Recortar Imagem">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"></path><path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"></path></svg>
                </button>
                <div class="tool-divider"></div>
                <button class="tool-btn" id="toolArrow" title="Adicionar Seta">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
                <button class="tool-btn" id="toolLine" title="Desenhar Linha Reta">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
                </button>
                <div class="dropdown-container">
                    <button class="tool-btn dropdown-trigger" id="toolShapesDropdown" title="Formas Geométricas">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shape-main-icon"><rect x="3" y="3" width="10" height="10" rx="1"></rect><circle cx="15" cy="15" r="5"></circle></svg>
                        <span class="dropdown-chevron">▼</span>
                    </button>
                    <div class="dropdown-menu" id="shapesMenu">
                        <button class="menu-item" id="shapeRect" title="Retângulo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                            <span>Retângulo</span>
                        </button>
                        <button class="menu-item" id="shapeCircle" title="Círculo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
                            <span>Círculo</span>
                        </button>
                        <button class="menu-item" id="shapeTriangle" title="Triângulo">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 22 22 2 22"></polygon></svg>
                            <span>Triângulo</span>
                        </button>
                        <button class="menu-item" id="shapeStar" title="Estrela">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                            <span>Estrela</span>
                        </button>
                        <button class="menu-item" id="shapeSpeechBubble" title="Balão de Fala">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            <span>Balão de Fala</span>
                        </button>
                        <button class="menu-item" id="shapeDashedLine" title="Linha Tracejada">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5" stroke-dasharray="4 3" style="stroke-dasharray: 4 3;"></line></svg>
                            <span>Linha Tracejada</span>
                        </button>
                    </div>
                </div>

                <div class="dropdown-container">
                    <button class="tool-btn dropdown-trigger" id="toolEmojisDropdown" title="Adicionar Emojis">
                        <span class="emoji-trigger-icon">😊</span>
                        <span class="dropdown-chevron">▼</span>
                    </button>
                    <div class="dropdown-menu emoji-grid" id="emojisMenu">
                        <button class="emoji-item" data-emoji="👍" title="Gostei">👍</button>
                        <button class="emoji-item" data-emoji="🚀" title="Foguete">🚀</button>
                        <button class="emoji-item" data-emoji="💡" title="Ideia">💡</button>
                        <button class="emoji-item" data-emoji="❌" title="Erro">❌</button>
                        <button class="emoji-item" data-emoji="✔️" title="Sucesso">✔️</button>
                        <button class="emoji-item" data-emoji="🔥" title="Atenção">🔥</button>
                        <button class="emoji-item" data-emoji="🎯" title="Objetivo">🎯</button>
                        <button class="emoji-item" data-emoji="📌" title="Fixar">📌</button>
                        <button class="emoji-item" data-emoji="⚠️" title="Aviso">⚠️</button>
                        <button class="emoji-item" data-emoji="💬" title="Comentário">💬</button>
                        <button class="emoji-item" data-emoji="❓" title="Dúvida">❓</button>
                        <button class="emoji-item" data-emoji="🔒" title="Seguro">🔒</button>
                        <button class="emoji-item" data-emoji="💻" title="Sistema">💻</button>
                        <button class="emoji-item" data-emoji="🤔" title="Pensando">🤔</button>
                        <button class="emoji-item" data-emoji="👀" title="Olhar">👀</button>
                        <button class="emoji-item" data-emoji="⭐" title="Destaque">⭐</button>
                    </div>
                </div>

                <button class="tool-btn toggle-btn" id="toolFillToggle" title="Preenchimento de Formas (Translúcido)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22h20L12 2z"></path><path d="M12 6l-6 10h12L12 6z" fill="currentColor" fill-opacity="0.2" class="fill-preview-path" style="fill: currentColor; fill-opacity: 0.15;"></path></svg>
                </button>
                <button class="tool-btn" id="toolPen" title="Caneta Livre">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </button>
                <button class="tool-btn" id="toolHighlighter" title="Marca-Texto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18.72 10.28L13.72 5.28c-.78-.78-2.05-.78-2.83 0l-7.61 7.61c-.38.38-.6 1.05-.6 1.59l-.02 4.24c0 .55.45 1 1 1h4.24c.54 0 1.21-.22 1.59-.6l7.61-7.61c.78-.78.78-2.05 0-2.83z"></path><line x1="2.5" y1="21.5" x2="21.5" y2="21.5"></line></svg>
                </button>
                <button class="tool-btn" id="toolStep" title="Etapas Automáticas (①, ②, ③)">
                    <span class="tool-txt-icon">①</span>
                </button>
                <button class="tool-btn" id="toolText" title="Adicionar Texto">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                </button>
                <button class="tool-btn" id="toolBlur" title="Desfocar / Pixelar Informações">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><circle cx="15" cy="15" r="2"></circle></svg>
                </button>
                <button class="tool-btn" id="toolMagnifier" title="Lupa de Aumento (Zoom)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
                </button>
                <button class="tool-btn" id="btnUploadWatermark" title="Adicionar Logo / Imagem (Marca d'água)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </button>
                <input type="file" id="watermarkFileInput" accept="image/*" class="hidden" style="display: none;">
                <div class="tool-divider"></div>
                <button class="tool-btn" id="btnUndo" title="Desfazer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
                </button>
                <button class="tool-btn" id="btnReset" title="Limpar Anotações">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
                <div class="tool-divider"></div>
                <!-- Cores Premium -->
                <div class="color-picker-wrap">
                    <button class="color-dot active" style="background-color: #10b981;" data-color="#10b981" title="Neon Green"></button>
                    <button class="color-dot" style="background-color: #06b6d4;" data-color="#06b6d4" title="Cyber Blue"></button>
                    <button class="color-dot" style="background-color: #ec4899;" data-color="#ec4899" title="Hot Pink"></button>
                    <button class="color-dot" style="background-color: #f59e0b;" data-color="#f59e0b" title="Amber Gold"></button>
                    <button class="color-dot" style="background-color: #ef4444;" data-color="#ef4444" title="Crimson Red"></button>
                    <button class="color-dot" style="background-color: #8b5cf6;" data-color="#8b5cf6" title="Electric Purple"></button>
                    <button class="color-dot" style="background-color: #f97316;" data-color="#f97316" title="Sunset Orange"></button>
                    <button class="color-dot" style="background-color: #eab308;" data-color="#eab308" title="Lemon Yellow"></button>
                    <button class="color-dot" style="background-color: #ffffff;" data-color="#ffffff" title="Clean White"></button>
                </div>
                <div class="tool-divider"></div>
                <!-- Tamanho da Fonte -->
                <div class="font-size-wrap" title="Tamanho da Fonte (texto)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5;"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
                    <select id="selectFontSize" class="font-size-select">
                        <option value="12">12</option>
                        <option value="16">16</option>
                        <option value="20" selected>20</option>
                        <option value="28">28</option>
                        <option value="36">36</option>
                        <option value="48">48</option>
                    </select>
                </div>
                <!-- Espessura do Traço/Borda -->
                <div class="font-size-wrap" title="Espessura do Traço/Borda">
                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5;"><line x1="5" y1="12" x2="19" y2="12"></line><line x1="5" y1="12" x2="19" y2="12" stroke-width="5" style="stroke-width: 5;"></line></svg>
                    <select id="selectLineWidth" class="font-size-select">
                        <option value="2">2px</option>
                        <option value="4" selected>4px</option>
                        <option value="6">6px</option>
                        <option value="8">8px</option>
                        <option value="12">12px</option>
                    </select>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="header-right">
            </div>
        </header>

        <!-- Main Body -->
        <div class="editor-body">
            <!-- Left Sidebar: Sharing & Export -->
            <aside class="editor-sidebar-left">
                <div class="sidebar-section">
                    <span class="section-label">Ações Rápidas</span>
                    <button class="sidebar-action-btn primary-action" id="btnCopyClip">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        <span>Copiar Imagem</span>
                    </button>
                    <button class="sidebar-action-btn" id="btnDownload">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Baixar Imagem</span>
                    </button>
                    <button class="sidebar-action-btn" id="btnWatermark" style="margin-top: 8px; border: 1px dashed rgba(255, 184, 0, 0.3); color: #f59e0b;">
                        <span>✍️ Inserir Marca d'água</span>
                    </button>
                </div>

                <div class="sidebar-section">
                    <span class="section-label">Apresentação & Estilo</span>
                    <!-- Toggle de Fundo Mockup -->
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                        <span class="input-label-sm" style="color: var(--text-secondary);">Fundo de Apresentação</span>
                        <label class="switch-premium">
                            <input type="checkbox" id="checkMockup">
                            <span class="slider-premium"></span>
                        </label>
                    </div>
                    
                    <!-- Seletor de Fundo Mockup -->
                    <div class="org-group hidden" id="mockupOptions" style="margin-bottom: 4px; display: none;">
                        <label class="input-label-sm">Estilo do Fundo</label>
                        <select id="selectMockupBg" class="sidebar-select">
                            <option value="gradient-purple">Gradiente Roxo Místico</option>
                            <option value="gradient-aurora">Gradiente Aurora Neon</option>
                            <option value="gradient-sunset">Gradiente Pôr do Sol</option>
                            <option value="dark-neon">Escuro Sólido Elegante</option>
                            <option value="transparent">Transparente (PNG Puro)</option>
                        </select>
                    </div>
                </div>

                <div class="sidebar-section">
                    <span class="section-label">Nuvem e Links</span>
                    <button class="sidebar-action-btn" id="btnShareLink">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                        <span>Gerar Link curto</span>
                    </button>
                    <div id="linkOutputContainer" class="link-output-box hidden">
                        <input type="text" id="sharedLinkUrl" readonly class="link-input">
                        <button class="copy-input-btn" id="btnCopyInput" title="Copiar URL">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <span class="section-label">Organização & Notas</span>
                    <div class="org-group">
                        <label class="input-label-sm">Categoria</label>
                        <select id="selectCategory" class="sidebar-select">
                            <option value="Outros">Outros</option>
                            <option value="Trabalho">Trabalho</option>
                            <option value="Estudos">Estudos</option>
                        </select>
                    </div>
                    <div class="org-group" style="margin-top: 8px;">
                        <label class="input-label-sm">Tags (separadas por vírgula)</label>
                        <input type="text" id="inputTags" placeholder="ex: bug, dashboard" class="sidebar-input">
                    </div>
                    <div class="org-group" style="margin-top: 8px;">
                        <label class="input-label-sm">Notas</label>
                        <textarea id="txtNotes" placeholder="Adicione observações..." class="sidebar-textarea"></textarea>
                    </div>
                    <!-- Indicador de salvamento automático -->
                    <div id="autoSaveIndicator" style="
                        display: none;
                        align-items: center;
                        gap: 5px;
                        margin-top: 6px;
                        font-size: 11px;
                        color: #10b981;
                        opacity: 0;
                        transition: opacity 0.3s ease;
                    ">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        Salvo automaticamente
                    </div>
                </div>

                <div class="sidebar-section">
                    <span class="section-label">Social Share</span>
                    <div class="social-grid">
                        <button class="social-btn" id="shareWhatsApp" title="WhatsApp">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </button>
                        <button class="social-btn" id="shareTelegram" title="Telegram">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                        <button class="social-btn" id="btnQrCode" title="Gerar QR Code">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section qr-section hidden" id="qrContainer">
                    <span class="section-label">QR Code Gerado</span>
                    <div id="qrcode" class="qr-box"></div>
                </div>
            </aside>

            <!-- Center Canvas Viewport -->
            <main class="canvas-container" id="canvasContainer">
                <canvas id="editingCanvas"></canvas>
            </main>

            <!-- Right Sidebar: IA Engine (Raycast / Notion Style) -->
            <aside class="editor-sidebar-right">
                <div class="sidebar-section">
                    <span class="section-label">Inteligência Artificial</span>
                    <div class="ai-button-stack">
                        <button class="ai-sidebar-btn" id="btnOcr">
                            <span class="ai-icon">🔍</span>
                            <div class="ai-btn-text">
                                <span class="ai-btn-title">Extrair Texto (OCR)</span>
                                <span class="ai-btn-desc">Copia os textos da imagem</span>
                            </div>
                        </button>
                        <button class="ai-sidebar-btn" id="btnExplain">
                            <span class="ai-icon">💡</span>
                            <div class="ai-btn-text">
                                <span class="ai-btn-title">Explicar esta Tela</span>
                                <span class="ai-btn-desc">Analisa e decifra a imagem</span>
                            </div>
                        </button>
                        <button class="ai-sidebar-btn" id="btnTutorial">
                            <span class="ai-icon">📝</span>
                            <div class="ai-btn-text">
                                <span class="ai-btn-title">Criar Passo a Passo</span>
                                <span class="ai-btn-desc">Gera um manual Markdown</span>
                            </div>
                        </button>
                        <button class="ai-sidebar-btn" id="btnTranslate">
                            <span class="ai-icon">🌐</span>
                            <div class="ai-btn-text">
                                <span class="ai-btn-title">Traduzir Conteúdo</span>
                                <span class="ai-btn-desc">Traduz textos da imagem</span>
                            </div>
                        </button>
                    </div>

                    <!-- Custom Prompt Chat Copilot -->
                    <div class="ai-chat-box" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                        <label class="input-label-sm" style="color: var(--accent-color); font-weight: 600; display: block; margin-bottom: 6px;">💬 Pergunte sobre esta Captura ou tire dúvidas sobre como usar a Extensão</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="aiChatInput" placeholder="Ex: 'Traduza o texto deste print' ou 'Como coloco marca d'água?'" class="sidebar-input" style="flex: 1; font-size: 11px; height: 32px; background: rgba(0,0,0,0.25); border: 1px solid var(--border-color); border-radius: 8px; color: #ffffff; padding: 0 10px;">
                            <button class="sidebar-action-btn primary-action" id="btnAiChatSend" style="padding: 0 12px; width: auto; font-size: 11px; font-weight: 700; height: 32px; border-radius: 8px; margin-top: 0; white-space: nowrap;">Enviar</button>
                        </div>
                    </div>
                </div>

                <!-- AI Output Box (Notion Sleek Markdown Viewport) -->
                <div class="sidebar-section ai-output-section hidden" id="aiOutputSection">
                    <div class="ai-output-header">
                        <span class="section-label">Resultado do IA Engine</span>
                        <button class="copy-markdown-btn" id="btnCopyOutput" title="Copiar Texto">
                            Copiar
                        </button>
                    </div>
                    <div class="ai-output-box" id="aiOutputContent">
                        <!-- Conteúdo carregado dinamicamente -->
                    </div>
                    <div class="ai-loader hidden" id="aiLoader">
                        <div class="ai-spinner"></div>
                        <span>Processando com IA...</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Onscreen notifications -->
    <div id="toastNotification" class="toast hidden">Notificação</div>

    <script src="editor.js"></script>
</body>
</html>
